<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Minesweeper</h1>

        <div class="controls">
            <div class="difficulty">
                <label>Difficulty:</label>
                <button id="easy" class="diff-btn active">Easy (9x9)</button>
                <button id="medium" class="diff-btn">Medium (16x16)</button>
                <button id="hard" class="diff-btn">Hard (16x30)</button>
            </div>

            <div class="game-info">
                <div class="info-item">
                    <span class="label">Mines:</span>
                    <span id="mines-count">10</span>
                </div>
                <div class="info-item">
                    <span class="label">Time:</span>
                    <span id="timer">000</span>
                </div>
                <button id="restart" class="restart-btn">New Game</button>
            </div>
        </div>

        <div id="game-board" class="game-board"></div>

        <div id="game-message" class="game-message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
